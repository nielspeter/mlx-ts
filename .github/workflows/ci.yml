name: ci

on:
  push: { branches: [main] }
  pull_request:

# One macOS job, not a Linux "static" job plus a macOS one. The split looked
# tidy but the Linux half could never work: typecheck and the audit both read
# src/ffi/generated.ts, which is emitted by tools/codegen.ts from the installed
# mlx-c headers and is therefore absent on a fresh clone anywhere without them.
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }

      - run: brew install mlx-c
      - run: bun install --frozen-lockfile

      - name: codegen (required before anything type-checks)
        run: bun tools/codegen.ts

      - run: bun run typecheck
      - run: bun tools/audit.ts
      - run: bun tools/check-api.ts

      - name: arena / ownership tests
        run: bun test tests/arena.test.ts
      - name: op parity fixtures
        run: bun test tests/lib.test.ts

      - name: examples on Bun, Deno and Node
        run: |
          for ex in basics module train; do
            bun examples/$ex.ts
            deno run --allow-all examples/$ex.ts
            node examples/$ex.ts
          done

      - name: same fingerprint on all three runtimes
        run: |
          fp() { grep -oE 'sum *= *[-0-9.]+' | tr -d ' '; }
          B=$(bun validation/block-gen.ts | fp)
          D=$(deno run --allow-all validation/block-gen.ts | fp)
          N=$(node validation/block-gen.ts | fp)
          echo "bun=$B deno=$D node=$N"
          [ "$B" = "$D" ] && [ "$B" = "$N" ] && [ -n "$B" ]

      # The full parity suite (scripts/validate-all.sh) stays local: it needs
      # ~9 GB of model weights.
