<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mlx-ts chat</title>
<style>
  :root {
    --bg: #0e1014; --panel: #161a22; --line: #232a36; --txt: #e7ecf3;
    --muted: #8b97a8; --accent: #4f8cff; --user: #1d2b46; --asst: #171c25;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--txt); display: flex; justify-content: center;
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #app { display: flex; flex-direction: column; width: 100%; max-width: 760px; height: 100%; }
  header {
    display: flex; align-items: baseline; gap: 10px; padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  header .model { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  header button {
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  header button:hover { color: var(--txt); border-color: var(--muted); }
  #log { flex: 1; overflow-y: auto; padding: 22px 18px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 80%; padding: 10px 13px; border-radius: 13px; white-space: pre-wrap;
    word-wrap: break-word; border: 1px solid var(--line);
  }
  .user .bubble { background: var(--user); border-color: #294066; border-bottom-right-radius: 4px; }
  .assistant .bubble { background: var(--asst); border-bottom-left-radius: 4px; }
  .bubble .cursor { opacity: .6; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  form {
    display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line);
    align-items: flex-end;
  }
  textarea {
    flex: 1; resize: none; background: var(--panel); color: var(--txt);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    font: inherit; max-height: 160px; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .ctrls { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .ctrls input[type=range] { width: 90px; accent-color: var(--accent); }
  button.send {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.send:disabled { opacity: .5; cursor: default; }
  button.mic {
    background: var(--panel); color: var(--txt); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; font-size: 16px; line-height: 1; cursor: pointer;
  }
  button.mic:hover { border-color: var(--muted); }
  button.mic.recording { background: #b3261e; border-color: #b3261e; color: #fff; }
  button.mic:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>mlx-ts chat</h1>
    <span class="model" id="model">…</span>
    <span class="spacer"></span>
    <span class="ctrls">temp <input id="temp" type="range" min="0" max="1.5" step="0.1" value="0.7" /><span id="tempv">0.7</span></span>
    <button id="reset">New chat</button>
  </header>
  <div id="log"></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Message…  (Enter to send, Shift+Enter for newline)"></textarea>
    <button class="mic" id="mic" type="button" title="Record speech to transcribe">🎤</button>
    <button class="send" id="send" type="submit">Send</button>
  </form>
</div>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), form = $("form"), send = $("send");
let messages = [];
let streaming = false;

fetch("/v1/models").then(r => r.json()).then(d => { $("model").textContent = d.data?.[0]?.id ?? ""; }).catch(() => {});
$("temp").addEventListener("input", () => $("tempv").textContent = $("temp").value);

function addBubble(role) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const b = document.createElement("div");
  b.className = "bubble";
  wrap.appendChild(b);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return b;
}

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
$("reset").addEventListener("click", () => { messages = []; log.innerHTML = ""; });

// --- speech: record mic audio -> /v1/audio/transcriptions -> input box ---
const mic = $("mic");
let recorder = null, chunks = [];
mic.addEventListener("click", async () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { alert("Microphone access denied: " + e); return; }
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = async () => {
    stream.getTracks().forEach((t) => t.stop());
    mic.classList.remove("recording"); mic.textContent = "⏳"; mic.disabled = true;
    const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
    const fd = new FormData();
    fd.append("file", blob, "recording.webm");
    try {
      const res = await fetch("/v1/audio/transcriptions", { method: "POST", body: fd });
      const text = ((await res.json()).text || "").trim();
      input.value = (input.value.trim() ? input.value.trim() + " " : "") + text;
      input.dispatchEvent(new Event("input"));
      input.focus();
    } catch (e) { alert("Transcription failed: " + e); }
    mic.textContent = "🎤"; mic.disabled = false;
  };
  recorder.start();
  mic.classList.add("recording"); mic.textContent = "⏹";
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || streaming) return;
  input.value = ""; input.style.height = "auto";
  messages.push({ role: "user", content: text });
  addBubble("user").textContent = text;

  streaming = true; send.disabled = true;
  const out = addBubble("assistant");
  out.innerHTML = '<span class="cursor">▍</span>';
  let acc = "";
  try {
    const res = await fetch("/v1/chat/completions", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ messages, stream: true, temperature: parseFloat($("temp").value), top_k: 40, repetition_penalty: 1.1 }),
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n\n");
      buf = parts.pop();
      for (const part of parts) {
        const line = part.replace(/^data: /, "").trim();
        if (!line || line === "[DONE]") continue;
        const delta = JSON.parse(line).choices?.[0]?.delta?.content;
        if (delta) { acc += delta; out.textContent = acc; log.scrollTop = log.scrollHeight; }
      }
    }
  } catch (err) {
    out.textContent = acc + "\n\n[error: " + err + "]";
  }
  out.textContent = acc || "(no output)";
  messages.push({ role: "assistant", content: acc });
  streaming = false; send.disabled = false; input.focus();
});
</script>
</body>
</html>
